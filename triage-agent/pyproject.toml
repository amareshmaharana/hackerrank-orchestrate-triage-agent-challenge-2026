[project]
name = "triage-agent"
version = "0.1.0"
description = "Terminal-based Multi-Domain Support Triage Agent"
authors = [ { name = "Triager", email = "triager@example.com" }]

[tool.poetry.dependencies]
python = "^3.9"
sentence-transformers = "^2.2.2"
faiss-cpu = "^1.7.4"
rank-bm25 = "^0.2.2"
typer = "^0.7.0"
rich = "^13.0.0"
pydantic = "^1.10.7"
numpy = "^1.25.0"
scikit-learn = "^1.2.2"
pytest = "^7.4.0"
pypdf = "^5.0.0"
tqdm = "^4.66.0"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
